<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>RECKONER CONTROL</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="scanlines"></div>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">[RECKONER]</div>
      <div class="header-right">
        <button class="map-toggle" id="mapToggleBtn" onclick="toggleMap()">
          <span class="map-toggle-icon">▦</span> MAP
        </button>
        <div class="conn-badge">
          <span class="conn-dot" id="connDot"></span>
          <span class="conn-label" id="connLabel">OFFLINE</span>
        </div>
      </div>
    </header>

    <!-- Body: map panel + main controls, side-by-side on desktop -->
    <div class="body-wrap">

      <!-- Top-down Map -->
      <div class="map-panel" id="mapPanel">
        <div class="map-header">
          <span class="map-title">TOP-DOWN PATH</span>
          <span class="map-scale" id="mapScale">RANGE —</span>
        </div>
        <canvas id="mapCanvas"></canvas>
        <div class="map-layer-toggles">
          <button class="layer-btn active" id="btnRaw" onclick="toggleLayer('raw')">RAW</button>
          <button class="layer-btn active" id="btnSLAM" onclick="toggleLayer('slam')">SLAM</button>
          <button class="layer-btn active" id="btnBoth" onclick="toggleLayer('both')">BOTH</button>
        </div>
      </div>

      <div class="main-col">

        <!-- Telemetry Strip -->
        <div class="telemetry">
          <div class="telem-cell">
            <span class="telem-axis">X</span>
            <span class="telem-val" id="tX">0.00</span>
            <span class="telem-unit">mm</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">Y</span>
            <span class="telem-val" id="tY">0.00</span>
            <span class="telem-unit">mm</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">θ</span>
            <span class="telem-val" id="tTheta">0.00</span>
            <span class="telem-unit">°</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">D</span>
            <span class="telem-val" id="tDist">0.00</span>
            <span class="telem-unit">mm</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">Xₛ</span>
            <span class="telem-val" id="tXScan">0.00</span>
            <span class="telem-unit">mm</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">Yₛ</span>
            <span class="telem-val" id="tYScan">0.00</span>
            <span class="telem-unit">mm</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">Kp</span>
            <span class="telem-val" id="tKp">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">ERR</span>
            <span class="telem-val" id="tError">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">∫</span>
            <span class="telem-val" id="tIntegral">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">LPWM</span>
            <span class="telem-val" id="tLpwm">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">RPWM</span>
            <span class="telem-val" id="tRpwm">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">ΔR</span>
            <span class="telem-val" id="tDeltaRight">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">ΔL</span>
            <span class="telem-val" id="tDeltaLeft">—</span>
          </div>
          <div class="telem-cell">
            <span class="telem-axis">VL53</span>
            <span class="telem-val" id="tVL53">—</span>
          </div>
        </div>

        <!-- D-Pad -->
        <div class="dpad-wrap">
          <div class="dpad">

            <!-- Up -->
            <button class="btn btn-dir" id="btnUp"
              data-cmd="FORWARD"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">▲</span>
              <span class="btn-lbl">FWD</span>
            </button>

            <button class="btn btn-dir" id="btnNW"
              data-cmd="FORWARD_LEFT"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">↖</span>
              <span class="btn-lbl">N-W</span>
            </button>

            <!-- Middle row -->
            <button class="btn btn-dir" id="btnLeft"
              data-cmd="LEFT"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">◀</span>
              <span class="btn-lbl">LEFT</span>
            </button>

            <button class="btn btn-stop" id="btnStop"
              data-cmd="STOP"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">■</span>
              <span class="btn-lbl">STOP</span>
            </button>

            <button class="btn btn-dir" id="btnNE"
              data-cmd="FORWARD_RIGHT"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">↗</span>
              <span class="btn-lbl">N-E</span>
            </button>

            <button class="btn btn-dir" id="btnSW"
              data-cmd="BACKWARD_LEFT"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">↙</span>
              <span class="btn-lbl">S-W</span>
            </button>

            <button class="btn btn-dir" id="btnRight"
              data-cmd="RIGHT"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">▶</span>
              <span class="btn-lbl">RIGHT</span>
            </button>

            <button class="btn btn-dir" id="btnSE"
              data-cmd="BACKWARD_RIGHT"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">↘</span>
              <span class="btn-lbl">S-E</span>
            </button>

            <!-- Down -->
            <button class="btn btn-dir" id="btnDown"
              data-cmd="BACKWARD"
              ontouchstart="pressBtn(this)" ontouchend="releaseBtn(this)"
              onmousedown="pressBtn(this)" onmouseup="releaseBtn(this)" onmouseleave="releaseBtn(this)">
              <span class="btn-arrow">▼</span>
              <span class="btn-lbl">REV</span>
            </button>

          </div>
        </div>

        <!-- Current Command -->
        <div class="cmd-bar">
          <span class="cmd-prefix">CMD &gt;</span>
          <span class="cmd-val" id="cmdVal">IDLE</span>
        </div>

        <!-- Reset -->
        <button class="reset-btn" onclick="resetOrigin()">⟳ RESET ORIGIN</button>

        <!-- Log -->
        <div class="log" id="log">
          <div class="log-line log-info">&gt; System ready</div>
        </div>

      </div><!-- /main-col -->

    </div><!-- /body-wrap -->

  </div>

  <script>
    const WS_URL = 'ws://10.80.123.23:8765';  // ← Python server IP:port
    let ws = null;

    // ── Tunable debug thresholds (adjust these while tuning PID) ──
    const ERROR_WARN_THRESHOLD = 150;   // flag |error| above this as a likely overshoot
    const PWM_SATURATION       = 250;   // flag LPWM/RPWM near max (assumes ~0-255 range)
    const SWEEP_VARIANCE_WARN  = 15;    // mm — if a whole SCAN sweep barely changes, servo probably isn't rotating

    // ── Map state ────────────────────────────────────────────
    const mapCanvas    = document.getElementById('mapCanvas');
    const mapCtx       = mapCanvas.getContext('2d');
    const mapScaleLbl  = document.getElementById('mapScale');
    const mapPanel     = document.getElementById('mapPanel');
    const mapToggleBtn = document.getElementById('mapToggleBtn');

    let pathHistory    = [];   // {x, y} mm — raw encoder/odometry trail (green line)
    let obstaclePoints = [];   // {x, y} reserved for future obstacle-only messages
    let liveScanTrail  = [];   // {x, y} — trailing buffer of the single live x_scan/y_scan point (blue)
    let sweepHistory   = [];   // [{points:[{x,y}...], gen:number}] — one entry per completed SCAN sweep (green, fades with age)
    let sweepGenCounter = 0;
    let mapLayerMode = 'both';  // 'raw', 'slam', or 'both'

    // Pose-graph (visual SLAM) state — populated by TRAJECTORY_UPDATE messages
    let poseGraphNodes  = [];  // [{id, x, y, theta}, ...] most recent optimized trajectory
    let loopEdge        = null; // {from, to} ids of the keyframe pair that just closed the loop
    let loopFlashUntil  = 0;   // performance.now() timestamp; while now < this, flash the pose graph
    let flashLoopRunning = false;

    const MAX_SWEEPS       = 30;    // how many past SCAN sweeps to keep on screen (fading)
    const MAX_LIVE_TRAIL   = 12;    // how many live single-point scan dots to keep
    const MAX_SENSOR_RANGE = 1000;  // ignore readings beyond 1000mm (noise/out of range)
    const MIN_SENSOR_RANGE = 20;    // ignore readings below 20mm (too close, likely invalid)
    let lastTheta   = 0;    // degrees
    let mapOpen     = false;
    const MAX_POINTS = 3000;
    const DESKTOP_BREAKPOINT = 700;

    function isDesktopLayout() {
      return window.innerWidth >= DESKTOP_BREAKPOINT;
    }

    function toggleMap() {
      mapOpen = !mapOpen;
      mapPanel.classList.toggle('open', mapOpen);
      mapToggleBtn.classList.toggle('active', mapOpen);
      if (mapOpen) requestAnimationFrame(resizeMapCanvas);
    }

    function toggleLayer(mode) {
        mapLayerMode = mode;
        document.getElementById('btnRaw').classList.toggle('active', mode === 'raw' || mode === 'both');
        document.getElementById('btnSLAM').classList.toggle('active', mode === 'slam' || mode === 'both');
        document.getElementById('btnBoth').classList.toggle('active', mode === 'both');
        drawMap();
    }

    function resizeMapCanvas() {
      const rect = mapCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const dpr = window.devicePixelRatio || 1;
      mapCanvas.width  = rect.width  * dpr;
      mapCanvas.height = rect.height * dpr;
      mapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawMap();
    }

    function shouldDraw() {
      return mapOpen || isDesktopLayout();
    }

    // ── Legend so the four point colors are self-explanatory ──
    function ensureLegend() {
      if (document.getElementById('mapLegend')) return;
      const legend = document.createElement('div');
      legend.id = 'mapLegend';
      legend.style.cssText = 'position:absolute;top:6px;right:8px;font:10px monospace;' +
        'color:#cfe;background:rgba(0,0,0,0.45);padding:4px 6px;border-radius:4px;' +
        'line-height:1.6;pointer-events:none;z-index:5;white-space:nowrap;';
      legend.innerHTML =
        '<span style="color:#3dff70">●</span> odometry &nbsp;' +
        '<span style="color:#4da6ff">●</span> live scan &nbsp;' +
        '<span style="color:#00ff66">●</span> raw ToF &nbsp;' +
        '<span style="color:#ff33e6">●</span> SLAM corrected';
      if (getComputedStyle(mapPanel).position === 'static') {
        mapPanel.style.position = 'relative';
      }
      mapPanel.appendChild(legend);
    }

    function drawMap() {
      const w = mapCanvas.clientWidth;
      const h = mapCanvas.clientHeight;
      if (!w || !h) return;
      mapCtx.clearRect(0, 0, w, h);

      const cx = w / 2, cy = h / 2;

      let maxExtentRaw  = 100;
      let maxExtentSLAM = 100;

      const trackRaw  = (p) => { if (Math.abs(p.x) > maxExtentRaw)  maxExtentRaw  = Math.abs(p.x); if (Math.abs(p.y) > maxExtentRaw)  maxExtentRaw  = Math.abs(p.y); };
      const trackSLAM = (p) => { if (Math.abs(p.x) > maxExtentSLAM) maxExtentSLAM = Math.abs(p.x); if (Math.abs(p.y) > maxExtentSLAM) maxExtentSLAM = Math.abs(p.y); };

      for (const p of pathHistory) trackRaw(p);
      for (const p of liveScanTrail) trackRaw(p);
      for (const s of sweepHistory) if (!s.corrected) for (const p of s.points) trackRaw(p);

      for (const n of poseGraphNodes) trackSLAM(n);
      for (const s of sweepHistory) if (s.corrected) for (const p of s.points) {
          if (Math.abs(p.x) < 5000 && Math.abs(p.y) < 5000) trackSLAM(p);
      }

      // Pick scale based on active mode
      let maxExtent;
      if (mapLayerMode === 'raw')  maxExtent = maxExtentRaw;
      else if (mapLayerMode === 'slam') maxExtent = maxExtentSLAM;
      else maxExtent = Math.max(maxExtentRaw, maxExtentSLAM);  // BOTH — use larger

      const showRaw  = mapLayerMode === 'raw'  || mapLayerMode === 'both';
      const showSLAM = mapLayerMode === 'slam' || mapLayerMode === 'both';

      const margin = 22;
      const scale = (Math.min(w, h) / 2 - margin) / maxExtent;
      mapScaleLbl.textContent = 'RANGE ' + Math.round(maxExtent * 2) + 'mm';

      const toScreen = (rx, ry) => ({ sx: cx - ry * scale, sy: cy - rx * scale });

      // Crosshair
      mapCtx.strokeStyle = 'rgba(58,90,58,0.4)';
      mapCtx.lineWidth = 1;
      mapCtx.beginPath();
      mapCtx.moveTo(cx, 0); mapCtx.lineTo(cx, h);
      mapCtx.moveTo(0, cy); mapCtx.lineTo(w, cy);
      mapCtx.stroke();

      // Origin
      mapCtx.fillStyle = '#e8a020';
      mapCtx.beginPath();
      mapCtx.arc(cx, cy, 4, 0, Math.PI * 2);
      mapCtx.fill();

      // ── RAW LAYER ───────────────────────────────────────────
      if (showRaw) {
        // Encoder path (green line)
        if (pathHistory.length > 1) {
          mapCtx.strokeStyle = '#3dff70';
          mapCtx.lineWidth = 1.5;
          mapCtx.shadowColor = 'rgba(61,255,112,0.5)';
          mapCtx.shadowBlur = 4;
          mapCtx.beginPath();
          const first = toScreen(pathHistory[0].x, pathHistory[0].y);
          mapCtx.moveTo(first.sx, first.sy);
          for (let i = 1; i < pathHistory.length; i++) {
            const p = toScreen(pathHistory[i].x, pathHistory[i].y);
            mapCtx.lineTo(p.sx, p.sy);
          }
          mapCtx.stroke();
          mapCtx.shadowBlur = 0;
        }

        // Raw ToF sweeps (green dots, fading)
        if (sweepHistory.length > 0) {
          const newestGen = sweepHistory[sweepHistory.length - 1].gen;
          for (const sweep of sweepHistory) {
            if (sweep.corrected) continue;  // skip corrected sweeps in raw layer
            const age = newestGen - sweep.gen;
            mapCtx.globalAlpha = Math.max(0.15, 1 - age * 0.12);
            mapCtx.fillStyle = '#00ff66';
            for (const p of sweep.points) {
                if (Math.abs(p.x) > 3000 || Math.abs(p.y) > 3000) continue;  // skip outliers
                const s = toScreen(p.x, p.y);
                mapCtx.beginPath();
                mapCtx.arc(s.sx, s.sy, 2.5, 0, Math.PI * 2);
                mapCtx.fill();
            }
          }
          mapCtx.globalAlpha = 1;
        }

        // Live scan trail (blue)
        if (liveScanTrail.length > 0) {
          for (let i = 0; i < liveScanTrail.length; i++) {
            const p = liveScanTrail[i];
            const isLatest = i === liveScanTrail.length - 1;
            const s = toScreen(p.x, p.y);
            mapCtx.globalAlpha = isLatest ? 1 : 0.35;
            mapCtx.fillStyle = '#4da6ff';
            mapCtx.beginPath();
            mapCtx.arc(s.sx, s.sy, isLatest ? 4 : 2, 0, Math.PI * 2);
            mapCtx.fill();
          }
          mapCtx.globalAlpha = 1;
        }
      }

      // ── SLAM LAYER ──────────────────────────────────────────
      if (showSLAM) {
          // Corrected scan points from SLAM (magenta dots)
          for (const sweep of sweepHistory) {
              if (!sweep.corrected) continue;
              mapCtx.fillStyle = '#ff33e6';
              mapCtx.globalAlpha = 0.7;
              for (const p of sweep.points) {
                  if (Math.abs(p.x) > 3000 || Math.abs(p.y) > 3000) continue;
                  const s = toScreen(p.x, p.y);
                  mapCtx.beginPath();
                  mapCtx.arc(s.sx, s.sy, 2.5, 0, Math.PI * 2);
                  mapCtx.fill();
              }
          }
          mapCtx.globalAlpha = 1;

        // Pose graph trajectory (magenta line + nodes)
        if (poseGraphNodes.length > 0) {
          const flashing = performance.now() < loopFlashUntil;
          mapCtx.strokeStyle = flashing ? '#ffffff' : '#ff33e6';
          mapCtx.lineWidth = flashing ? 3 : 1.5;
          mapCtx.shadowColor = 'rgba(255,51,230,0.7)';
          mapCtx.shadowBlur = flashing ? 10 : 3;
          mapCtx.beginPath();
          const first = toScreen(poseGraphNodes[0].x, poseGraphNodes[0].y);
          mapCtx.moveTo(first.sx, first.sy);
          for (let i = 1; i < poseGraphNodes.length; i++) {
            const p = toScreen(poseGraphNodes[i].x, poseGraphNodes[i].y);
            mapCtx.lineTo(p.sx, p.sy);
          }
          mapCtx.stroke();
          mapCtx.shadowBlur = 0;

          mapCtx.fillStyle = '#ff33e6';
          for (const n of poseGraphNodes) {
            const s = toScreen(n.x, n.y);
            mapCtx.fillRect(s.sx - 2.5, s.sy - 2.5, 5, 5);
          }

          // Loop closure edge (yellow dashed)
          if (loopEdge) {
            const nodeA = poseGraphNodes.find(n => n.id === loopEdge.from);
            const nodeB = poseGraphNodes.find(n => n.id === loopEdge.to);
            if (nodeA && nodeB) {
              const a = toScreen(nodeA.x, nodeA.y);
              const b = toScreen(nodeB.x, nodeB.y);
              mapCtx.save();
              mapCtx.strokeStyle = '#ffee00';
              mapCtx.lineWidth = 2;
              mapCtx.setLineDash([4, 4]);
              mapCtx.shadowColor = 'rgba(255,238,0,0.8)';
              mapCtx.shadowBlur = flashing ? 8 : 2;
              mapCtx.beginPath();
              mapCtx.moveTo(a.sx, a.sy);
              mapCtx.lineTo(b.sx, b.sy);
              mapCtx.stroke();
              mapCtx.restore();

              mapCtx.fillStyle = '#ffee00';
              [a, b].forEach(s => {
                mapCtx.beginPath();
                mapCtx.arc(s.sx, s.sy, 4, 0, Math.PI * 2);
                mapCtx.fill();
              });
            }
          }
        }
      }

      // Current robot position arrow (always shown)
      if (pathHistory.length > 0) {
        const last = pathHistory[pathHistory.length - 1];
        const pos  = toScreen(last.x, last.y);
        const rad  = lastTheta * Math.PI / 180;
        const arrowLen = 14;
        const tipX = pos.sx - Math.sin(rad) * arrowLen;
        const tipY = pos.sy - Math.cos(rad) * arrowLen;

        mapCtx.strokeStyle = '#e8a020';
        mapCtx.lineWidth = 2;
        mapCtx.beginPath();
        mapCtx.moveTo(pos.sx, pos.sy);
        mapCtx.lineTo(tipX, tipY);
        mapCtx.stroke();

        const headAngle = 0.5, headLen = 5;
        mapCtx.beginPath();
        mapCtx.moveTo(tipX, tipY);
        mapCtx.lineTo(tipX - Math.sin(rad + Math.PI - headAngle) * headLen,
                      tipY - Math.cos(rad + Math.PI - headAngle) * headLen);
        mapCtx.moveTo(tipX, tipY);
        mapCtx.lineTo(tipX - Math.sin(rad + Math.PI + headAngle) * headLen,
                      tipY - Math.cos(rad + Math.PI + headAngle) * headLen);
        mapCtx.stroke();

        mapCtx.fillStyle = '#3dff70';
        mapCtx.beginPath();
        mapCtx.arc(pos.sx, pos.sy, 3, 0, Math.PI * 2);
        mapCtx.fill();
      }
    }

    function startFlashLoop() {
      if (flashLoopRunning) return;
      flashLoopRunning = true;
      const step = () => {
        if (shouldDraw()) drawMap();
        if (performance.now() < loopFlashUntil) {
          requestAnimationFrame(step);
        } else {
          flashLoopRunning = false;
        }
      };
      requestAnimationFrame(step);
    }

    window.addEventListener('resize', () => {
      mapToggleBtn.style.display = isDesktopLayout() ? 'none' : '';
      if (shouldDraw()) resizeMapCanvas();
    });

    // ── WebSocket ────────────────────────────────────────────
    function connect() {
      addLog('Connecting...', 'info');
      ws = new WebSocket(WS_URL);
      ws.onopen  = () => { setConn(true);  addLog('Connected', 'ok'); };
      ws.onclose = () => { setConn(false); addLog('Lost connection. Retrying...', 'err'); setTimeout(connect, 3000); };
      ws.onerror = () => addLog('WebSocket error', 'err');
      ws.onmessage = (e) => {
        let d;
        try {
          d = JSON.parse(e.data);
          if (d.type) console.log("Message type received:", d.type);
        } catch (err) {
          addLog('RX: ' + e.data, 'info');
          return;
        }

        if (d.type === 'LOG') {
          console.log("%c[ROBOT]", "color: #00e676; font-weight: bold;", d.message);
        } else if (d.type === 'SCAN' && Array.isArray(d.measure)) {
          handleScanSweep(d);
        } else if (d.type === "TRAJECTORY_UPDATE") {
          handleTrajectoryUpdate(d);
        }  else {
          handleTelemetry(d);
        };
      };
    }

    // Regular per-tick telemetry: x, y, theta, dist, kp, error, integral, lpwm, rpwm,
    // delta_left, delta_right, measure (single VL53 reading), x_scan/y_scan (live point).
    function handleTelemetry(d) {
      if (d.x           !== undefined) document.getElementById('tX').textContent           = parseFloat(d.x).toFixed(2);
      if (d.y           !== undefined) document.getElementById('tY').textContent           = parseFloat(d.y).toFixed(2);
      if (d.theta       !== undefined) document.getElementById('tTheta').textContent       = parseFloat(d.theta).toFixed(2);
      if (d.dist        !== undefined) document.getElementById('tDist').textContent        = parseFloat(d.dist).toFixed(2);
      if (d.kp          !== undefined) document.getElementById('tKp').textContent          = d.kp;
      if (d.error       !== undefined) document.getElementById('tError').textContent       = d.error;
      if (d.integral    !== undefined) document.getElementById('tIntegral').textContent    = d.integral;
      if (d.lpwm        !== undefined) document.getElementById('tLpwm').textContent        = d.lpwm;
      if (d.rpwm        !== undefined) document.getElementById('tRpwm').textContent        = d.rpwm;
      if (d.delta_right !== undefined) document.getElementById('tDeltaRight').textContent = d.delta_right;
      if (d.delta_left  !== undefined) document.getElementById('tDeltaLeft').textContent  = d.delta_left;
      if (d.x_scan      !== undefined) document.getElementById('tXScan').textContent      = parseFloat(d.x_scan).toFixed(2);
      if (d.y_scan      !== undefined) document.getElementById('tYScan').textContent      = parseFloat(d.y_scan).toFixed(2);
      // A single scalar VL53 reading only — never an array (arrays are SCAN messages, handled separately)
      if (d.measure !== undefined && !Array.isArray(d.measure)) {
        document.getElementById('tVL53').textContent = d.measure;
      }

      // Path tracking (raw odometry)
      if (d.x !== undefined && d.y !== undefined) {
        pathHistory.push({ x: parseFloat(d.x), y: parseFloat(d.y) });
        if (pathHistory.length > MAX_POINTS) pathHistory.shift();
        if (d.theta !== undefined) lastTheta = parseFloat(d.theta);
      }

      // Live single-point scan (blue) — the ESP32's own current-angle TOF projection
      if (d.x_scan !== undefined && d.y_scan !== undefined) {
        const sx = parseFloat(d.x_scan);
        const sy = parseFloat(d.y_scan);
        if (Math.abs(sx) < 5000 && Math.abs(sy) < 5000) {
          liveScanTrail.push({ x: sx, y: sy });
          if (liveScanTrail.length > MAX_LIVE_TRAIL) liveScanTrail.shift();
        }
      }

      logTelemetry(d);

      if (shouldDraw()) drawMap();
    }

    // Full ToF sweep batch — one message per completed sweep of the servo
    function handleScanSweep(d) {
      const rx = parseFloat(d.x);
      const ry = parseFloat(d.y);
      const rThetaRad = parseFloat(d.theta) * (Math.PI / 180.0);
      const measures = d.measure;
      const stepAngle = Math.PI / (measures.length - 1); // spread across 0..180°

      const points = [];
      let minM = Infinity, maxM = -Infinity;
      measures.forEach((dist, i) => {
        if (dist > MIN_SENSOR_RANGE && dist < MAX_SENSOR_RANGE) {
          if (dist < minM) minM = dist;
          if (dist > maxM) maxM = dist;
          const servoAngle = (i * stepAngle) - (Math.PI / 2);
          const worldAngle = rThetaRad + servoAngle;
          points.push({
            x: rx + dist * Math.cos(worldAngle),
            y: ry + dist * Math.sin(worldAngle)
          });
        }
      });

      sweepGenCounter++;
      sweepHistory.push({ points, gen: sweepGenCounter });
      if (sweepHistory.length > MAX_SWEEPS) sweepHistory.shift();

      console.groupCollapsed(`[SCAN] sweep #${sweepGenCounter} — ${points.length}/${measures.length} valid pts`);
      console.log('pose:', { x: rx, y: ry, theta: parseFloat(d.theta) });
      console.log('range:', { min: minM, max: maxM, spread: (maxM - minM).toFixed(1) });
      console.groupEnd();

      // If distance barely varies across the whole sweep, the servo probably isn't rotating —
      // the arc you see is real math, just fed a near-constant distance at every angle.
      if (isFinite(minM) && isFinite(maxM) && (maxM - minM) < SWEEP_VARIANCE_WARN) {
        console.warn(`⚠ [SCAN] Sweep #${sweepGenCounter} range barely changes (Δ=${(maxM - minM).toFixed(1)}mm) — check that the servo is actually sweeping.`);
      }

      if (shouldDraw()) drawMap();
    }

    // Pose-graph optimization result — sent only when a loop closure was just detected & solved
    function handleTrajectoryUpdate(d) {
      poseGraphNodes = d.keyframes.map(k => ({
        id: k.id, x: parseFloat(k.x), y: parseFloat(k.y), theta: parseFloat(k.theta)
      }));
      // Extract corrected scan points from all keyframes
      sweepHistory = sweepHistory.filter(s => !s.corrected); // remove old corrected sweeps
      for (const k of d.keyframes) {
          if (k.scan_points && k.scan_points.length > 0) {
              const points = k.scan_points.map(pt => ({ x: pt[0], y: pt[1] }));
              sweepHistory.push({ points, gen: ++sweepGenCounter, corrected: true });
          }
      }
      loopEdge = (d.loop_from !== undefined && d.loop_to !== undefined)
        ? { from: d.loop_from, to: d.loop_to }
        : null;
      loopFlashUntil = performance.now() + 1500;

      console.groupCollapsed(`🔁 [LOOP CLOSURE] Pose graph re-optimized — ${poseGraphNodes.length} keyframes`);
      if (loopEdge) console.log('closed edge:', loopEdge);
      console.log('keyframes:', poseGraphNodes);
      console.groupEnd();

      console.group('🗺️ TRAJECTORY UPDATE DEBUG');
      console.log('total keyframes:', d.keyframes.length);
      console.log('corrected scan sample kf[0]:', d.keyframes[0]?.scan_points?.slice(0, 3));
      console.log('corrected scan sample kf[1]:', d.keyframes[1]?.scan_points?.slice(0, 3));
      const allPts = d.keyframes.flatMap(k => k.scan_points || []);
      const xs = allPts.map(p => p[0]);
      const ys = allPts.map(p => p[1]);
      console.log('total corrected points:', allPts.length);
      console.log('X range:', Math.min(...xs).toFixed(0), 'to', Math.max(...xs).toFixed(0));
      console.log('Y range:', Math.min(...ys).toFixed(0), 'to', Math.max(...ys).toFixed(0));
      console.groupEnd();

      startFlashLoop();
      if (shouldDraw()) drawMap();
    }

    // Structured console output for live PID tuning — one row per telemetry tick
    function logTelemetry(d) {
      const row = {
        x: fmt(d.x), y: fmt(d.y), theta: fmt(d.theta), dist: fmt(d.dist),
        kp: d.kp, error: d.error, integral: d.integral,
        lpwm: d.lpwm, rpwm: d.rpwm,
        delta_left: d.delta_left, delta_right: d.delta_right,
        x_scan: fmt(d.x_scan), y_scan: fmt(d.y_scan),
        vl53: Array.isArray(d.measure) ? undefined : d.measure
      };
      console.log('telemetry:', row);

      const errAbs = Math.abs(parseFloat(d.error));
      if (!Number.isNaN(errAbs) && errAbs > ERROR_WARN_THRESHOLD) {
        console.warn(`⚠ Large PID error: ${d.error} (Kp=${d.kp}) → LPWM=${d.lpwm} RPWM=${d.rpwm}`);
      }
      const lp = Math.abs(parseFloat(d.lpwm));
      const rp = Math.abs(parseFloat(d.rpwm));
      if ((!Number.isNaN(lp) && lp >= PWM_SATURATION) || (!Number.isNaN(rp) && rp >= PWM_SATURATION)) {
        console.warn(`⚠ PWM near saturation — L:${d.lpwm} R:${d.rpwm} (error=${d.error})`);
      }
    }

    function fmt(v) {
      const n = parseFloat(v);
      return Number.isNaN(n) ? v : n.toFixed(2);
    }

    function send(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
        document.getElementById('cmdVal').textContent = cmd;
      }
    }

    function pressBtn(el) {
      el.classList.add('active');
      send(el.dataset.cmd);
    }

    function releaseBtn(el) {
      el.classList.remove('active');
      // Only send STOP if not the stop button itself
      if (el.dataset.cmd !== 'STOP') {
        send('STOP');
        document.getElementById('cmdVal').textContent = 'IDLE';
      }
    }

    function resetOrigin() {
      send('RESET');
      ['tX','tY','tTheta','tDist','tXScan','tYScan'].forEach(id => document.getElementById(id).textContent = '0.00');
      pathHistory = [];
      obstaclePoints = [];
      liveScanTrail = [];
      sweepHistory = [];
      sweepGenCounter = 0;
      poseGraphNodes = [];
      loopEdge = null;
      lastTheta = 0;
      if (shouldDraw()) drawMap();
      addLog('Origin reset', 'ok');
    }

    function setConn(on) {
      document.getElementById('connDot').classList.toggle('on', on);
      document.getElementById('connLabel').textContent = on ? 'ONLINE' : 'OFFLINE';
    }

    function addLog(msg, type) {
      const log  = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'log-line log-' + type;
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      line.textContent = '[' + ts + '] ' + msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
      if (log.children.length > 30) log.removeChild(log.firstChild);
    }

    // ── Keyboard control (desktop) — standard ROS teleop_twist_keyboard layout ──
    const KEY_TO_BTN_ID = {
      'i': 'btnUp',
      ',': 'btnDown', '<': 'btnDown',
      'j': 'btnLeft',
      'l': 'btnRight',
      'k': 'btnStop',
      'u': 'btnNW',
      'o': 'btnNE',
      'm': 'btnSW',
      '.': 'btnSE', '>': 'btnSE'
    };
    const activeKeys = new Set();

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      const btnId = KEY_TO_BTN_ID[key];
      if (!btnId || activeKeys.has(key)) return;   // ignore held-key repeat events
      activeKeys.add(key);
      const el = document.getElementById(btnId);
      if (el) pressBtn(el);
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      const btnId = KEY_TO_BTN_ID[key];
      if (!btnId) return;
      activeKeys.delete(key);
      const el = document.getElementById(btnId);
      if (el) releaseBtn(el);
    });
    // Initial setup
    mapToggleBtn.style.display = isDesktopLayout() ? 'none' : '';
    ensureLegend();
    if (isDesktopLayout()) requestAnimationFrame(resizeMapCanvas);

    connect();
  </script>
</body>
